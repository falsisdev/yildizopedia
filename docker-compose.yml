services:
  yildizopedia-bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: yildizopedia_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Kod ve dökümanlar
      - .:/app
      # Kalıcı SQLite Veritabanı ve Loglar
      - ./var:/app/var
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
